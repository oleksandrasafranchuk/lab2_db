spring.application.name=demo

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/restaurant_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:restaurant_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:restaurant_pass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.pool-name=restaurant-pool

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/restaurant_nosql}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=2s

restaurant.nosql.receipts-collection=receipts
restaurant.redis.key-prefix=restaurant
restaurant.redis.default-ttl-seconds=900

restaurant.benchmark.receipts=5000
restaurant.benchmark.iterations=200
restaurant.benchmark.warmup=50

spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

logging.level.liquibase=INFO
